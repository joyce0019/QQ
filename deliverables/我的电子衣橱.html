function save(patch){const next={...data,...patch};let previous={};try{for(const k of Object.keys(patch))previous[k]=localStorage.getItem(keys[k]);for(const k of Object.keys(patch))localStorage.setItem(keys[k],JSON.stringify(next[k]));data=next;return true;}catch{try{for(const k of Object.keys(previous))previous[k]===null?localStorage.removeItem(keys[k]):localStorage.setItem(keys[k],previous[k]);}catch{}toast('保存失败：浏览器存储不足或不可用，请换用更小的图片。');return false;}}

function openModal(title,body,onSubmit){modalCleanup();const previous=document.activeElement;$('#modal-root').innerHTML=`<div class="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" tabindex="-1"><div class="modal-heading"><h2>${title}</h2><button type="button" class="icon" data-action="close-modal" aria-label="关闭">✕</button></div>${body}</div></div>`;document.body.style.overflow='hidden';const dialog=$('.modal');dialog.focus();function key(e){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const nodes=[...dialog.querySelectorAll('button,input,select,textarea,a[href]')].filter(n=>!n.disabled&&!n.hidden);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}}document.addEventListener('keydown',key);modalCleanup=()=>{document.removeEventListener('keydown',key);document.body.style.overflow='';previous?.focus();modalCleanup=()=>{};};$('.backdrop').addEventListener('click',e=>{if(e.target===$('.backdrop'))closeModal();});if(onSubmit)$('.modal form').onsubmit=e=>{e.preventDefault();onSubmit(new FormData(e.target),e.target);};}

function confirmDelete(title,description,fn){openModal(title,`<p class="muted">${description}</p><div class="modal-actions"><button class="button secondary" data-action="close-modal">取消</button><button class="button danger" id="confirm-delete">删除</button></div>`);$('#confirm-delete').onclick=()=>{if(fn()!==false){closeModal();render();}};}
function field(label,name,value='',type='text',extra=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}

function uploadBlock(image,label='将衣物照片拖到这里'){return `<label class="upload ${image?'has-image':''}"><img id="upload-preview" src="${esc(image||'')}" alt="上传预览" ${image?'':'hidden'}><div id="upload-text" ${image?'hidden':''}>${icon('plus')}<p>${label}</p><span>或 <b>选择图片</b></span><small>JPG、PNG 或 WEBP</small></div><input type="file" id="image-file" accept="image/jpeg,image/png,image/webp"><span class="replace" ${image?'':'hidden'}>更换图片</span></label><p class="upload-status" role="status"></p>`;}
function bindUpload(initial,onFile){let value=initial||'',busy=false;const input=$('#image-file'),label=input.closest('.upload');async function read(file){if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('请选择 JPG、PNG 或 WEBP 图片');return;}busy=true;$('.upload-status').textContent='正在处理图片…';$('.modal button[type="submit"]').disabled=true;try{const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=raw;});const ratio=Math.min(1,1200/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);value=canvas.toDataURL('image/webp',.82);$('#upload-preview').src=value;$('#upload-preview').hidden=false;$('#upload-text').hidden=true;label.classList.add('has-image');$('.replace').hidden=false;onFile?.(file.name);$('.upload-status').textContent='图片已准备好';}catch{toast('图片读取失败，请重新选择');$('.upload-status').textContent='读取失败';}finally{busy=false;$('.modal button[type="submit"]').disabled=false;}}input.onchange=()=>read(input.files[0]);label.ondragover=e=>e.preventDefault();label.ondrop=e=>{e.preventDefault();read(e.dataTransfer.files[0]);};return ()=>({value,busy});}
function clothingModal(cid){const old=data.items.find(i=>i.id===cid);let image;openModal(old?'编辑衣物':'添加到衣橱',`<form>${uploadBlock(old?.image)}<p id="mock-note" class="ai-note" hidden>✧ 已识别部分信息 <small>模拟识别 · 可手动修改</small></p>${field('名称','name',old?.name||'','text','required placeholder="例如：白色亚麻衬衫"')}<div class="form-row">${select('类别','category',categories,old?.category||'上装')}${select('颜色','color',colors,old?.color||'白色')}</div>${multi('季节','season',seasons,old?.season)}${multi('场合','occasion',occasions,old?.occasion)}${field('品牌（选填）','brand',old?.brand)}<div class="modal-actions"><button type="button" class="button secondary" data-action="close-modal">取消</button><button type="submit" class="button">${old?'保存修改':'添加到衣橱'}</button></div></form>`,f=>{const img=image();if(img.busy)return;if(!img.value){toast('请先选择图片');return;}if(!f.get('name').trim()){toast('请输入名称');return;}const item={id:old?.id||id(),name:f.get('name').trim(),image:img.value,category:f.get('category'),color:f.get('color'),season:f.getAll('season'),occasion:f.getAll('occasion'),brand:f.get('brand').trim(),favorite:old?.favorite||false,createdAt:old?.createdAt||new Date().toISOString()};if(save({items:old?data.items.map(i=>i.id===cid?item:i):[item,...data.items]})){closeModal();toast(old?'衣物已更新':'已添加到衣橱');render();}});image=bindUpload(old?.image,name=>{const lower=name.toLowerCase();$('.modal [name="category"]').value=/shoe|sneaker|鞋/.test(lower)?'鞋履':/bag|包/.test(lower)?'包袋':/jean|trouser|裤|裙/.test(lower)?'下装':/coat|blazer|外套|风衣/.test(lower)?'外套':'上装';$('.modal [name="color"]').value=colors.find((v,i)=>lower.includes(v)||lower.includes(['black','white','grey','beige','brown','blue','green','red','pink','yellow','purple','multi'][i]))||'白色';$('#mock-note').hidden=false;});}
function inspirationModal(){let image;openModal('添加灵感',`<form>${uploadBlock('','将穿搭灵感图片拖到这里')}${field('来源链接（选填）','sourceUrl','','url','placeholder="https://"')}${field('标题（选填）','title') }<label class="field">备注（选填）<textarea name="notes" placeholder="这套穿搭的哪些细节打动了你？"></textarea></label><div class="modal-actions"><button type="button" class="button secondary" data-action="close-modal">取消</button><button type="submit" class="button">保存灵感</button></div></form>`,f=>{const img=image();if(img.busy)return;if(!img.value){toast('请先选择图片');return;}const sourceUrl=f.get('sourceUrl').trim();if(sourceUrl&&!safeUrl(sourceUrl)){toast('请输入 http 或 https 来源链接');return;}if(save({inspirations:[{id:id(),image:img.value,title:f.get('title').trim(),sourceUrl,notes:f.get('notes').trim(),createdAt:new Date().toISOString()},...data.inspirations]})){closeModal();toast('灵感已保存');render();}});image=bindUpload('');}
function profileModal(){const fields=[['height','身高','cm',50,260],['weight','体重','kg',10,400],['shoulder','肩宽','cm',10,100],['bust','胸围','cm',20,250],['waist','腰围','cm',20,250],['hip','臀围','cm',20,250],['inseam','内侧腿长','cm',10,180]];openModal('我的身材数据',`<form><p class="muted">所有信息均为选填，只保存在当前浏览器中。</p><div class="body-form">${fields.map(([k,l,u,min,max])=>field(`${l}（${u}）`,k,data.profile[k]||'','number',`min="${min}" max="${max}" step="0.1"`)).join('')}</div><div class="modal-actions"><button type="button" class="button secondary" data-action="close-modal">取消</button><button type="submit" class="button">保存数据</button></div></form>`,f=>{const profile={};for(const [k] of fields){const v=f.get(k);if(v!=='')profile[k]=Number(v);}profile.updatedAt=new Date().toISOString();if(save({profile})){closeModal();toast('身材数据已保存');render();}});}
function logModal(logId,outfitId){const old=data.logs.find(l=>l.id===logId),selectedOutfit=outfitId||old?.outfitId||'';let image;const selectedIds=new Set(old?.pieces.map(p=>p.id)||data.outfits.find(o=>o.id===selectedOutfit)?.items.map(i=>i.clothingId)||[]);const available=[...data.items,...(old?.pieces.filter(p=>!data.items.some(i=>i.id===p.id))||[])];openModal(old?'编辑穿搭记录':'记录今日穿搭',`<form>${field('穿着日期','date',old?.date||dateKey(),'date','required max="'+dateKey()+'"')}${select('从已保存搭配选择（也可以直接勾选单品）','outfitId',['不使用已保存搭配'], '不使用已保存搭配')}<div class="field">这次穿着的单品 <span class="muted">（至少一件）</span><div class="log-selector">${available.map(i=>`<label><input type="checkbox" name="pieces" value="${i.id}" ${selectedIds.has(i.id)?'checked':''}><img src="${esc(i.image)}" alt=""><span>${esc(i.name)}</span></label>`).join('')}</div></div>${field('记录名称','name',old?.name||data.outfits.find(o=>o.id===selectedOutfit)?.name||'今日穿搭','text','required')}${select('场合','occasion',occasions,old?.occasion||'日常')}${uploadBlock(old?.photo,'添加实际穿着照片（选填）')}<label class="field">备注（选填）<textarea name="notes" placeholder="今天的场合、感受，或搭配心得">${esc(old?.notes||'')}</textarea></label><div class="modal-actions"><button type="button" class="button secondary" data-action="close-modal">取消</button><button type="submit" class="button">保存穿搭记录</button></div></form>`,f=>{const ids=f.getAll('pieces');if(!ids.length){toast('请至少选择一件穿着的单品');return;}if(image().busy)return;const name=f.get('name').trim();if(!name){toast('请输入记录名称');return;}const date=f.get('date');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>dateKey()){toast('请选择今天或之前的日期');return;}const outfit=data.outfits.find(o=>o.id===f.get('outfitId'));const pieces=ids.map(cid=>({...available.find(i=>i.id===cid)}));const originalLayout=outfit?.items||old?.layout||[];const included=new Set(ids);let layout=originalLayout.filter(i=>included.has(i.clothingId));const existingIds=new Set(layout.map(i=>i.clothingId));layout=[...layout,...compose(ids.filter(i=>!existingId function editorPage(oid){if(!editor){const o=data.outfits.find(o=>o.id===oid);if(oid&&!o)return missing('/outfits');const inspired=route().includes('?inspired=1');editor={id:oid,name:o?.name||(inspired?'灵感搭配':'未命名搭配'),items:structuredClone(o?.items||(inspired?compose(matches().map(i=>i.id)):[])),occasion:o?.occasion||'日常',season:o?.season||'春季',selected:null,search:'',category:'全部'};}return `<div class="editor"><div class="editor-header">${back('/outfits','返回')}<span>${oid?'编辑搭配':'新建搭配'}</span><button class="button" data-action="save-outfit">保存</button></div><div class="editor-meta">${field('搭配名称','outfitName',editor.name)}${select('场合','outfitOccasion',occasions.filter(o=>o!=='运动'),editor.occasion)}${select('季节','outfitSeason',seasons,editor.season)}</div><div class="editor-body"><div class="picker"><h2>我的衣橱 <small>${data.items.length} 件单品</small></h2><label class="search">⌕<input id="picker-search" placeholder="搜索衣物" value="${esc(editor.search)}"></label><div class="tabs">${['全部',...categories].map(c=>`<button data-action="picker-category" data-value="${c}" class="${editor.category===c?'selected':''}">${c}</button>`).join('')}</div><p class="picker-hint">点击衣物，将它添加到画布。</p><div class="picker-grid" id="picker-items">${pickerItems()}</div></div><div class="canvas-area"><div class="canvas-top"><span>自由组合你的风格</span><span id="canvas-count">${editor.items.length} 件单品</span></div><div class="canvas" id="canvas">${canvasItems()}</div><div class="canvas-tools" id="canvas-tools">${canvasTools()}</div></div></div></div>`;}

function canvasItems(){return editor.items.length?editor.items.map((i,n)=>{const c=data.items.find(c=>c.id===i.clothingId);return c?`<div class="canvas-item ${editor.selected===n?'selected':''}" data-index="${n}" style="left:${i.x/6}%;top:${i.y/7}%;width:${i.width/6}%;height:${i.height/7}%;z-index:${i.zIndex};transform:rotate(${i.rotation||0}deg)"><img src="${esc(c.image)}" alt="${esc(c.name)}" draggable="false">${editor.selected===n?['tl','tr','bl','br'].map(c=>`<button class="resize ${c}" data-corner="${c}" aria-label="缩放${{tl:'左上',tr:'右上',bl:'左下',br:'右下'}[c]}角"></button>`).join('')+`<button class="canvas-delete" data-action="canvas-delete" aria-label="移除单品">×</button>`:''}</div>`:'';}).join(''):'<div class="canvas-empty">'+icon('outfit')+'<h2>空白画布，无限可能。</h2><p>从衣橱选择一件单品，开始搭配。</p></div>';}

function updateCanvas(){ $('#canvas').innerHTML=canvasItems();$('#canvas-count').textContent=editor.items.length+' 件单品';$('#canvas-tools').innerHTML=canvasTools();bindCanvas();}
function bindCanvas(){const canvas=$('#canvas');canvas.onpointerdown=e=>{if(e.target===canvas||e.target.closest('.canvas-empty')){editor.selected=null;updateCanvas();}};$$('.canvas-item').forEach(el=>{el.onpointerdown=e=>{if(e.target.closest('[data-action="canvas-delete"]'))return;e.preventDefault();e.stopPropagation();const n=Number(el.dataset.index),corner=e.target.dataset.corner;const old={...editor.items[n]},scale=600/canvas.getBoundingClientRect().width,sx=e.clientX,sy=e.clientY;editor.selected=n;$$('.canvas-item').forEach(i=>{i.classList.remove('selected');i.querySelectorAll('button').forEach(b=>b.remove());});el.classList.add('selected');el.insertAdjacentHTML('beforeend',['tl','tr','bl','br'].map(c=>`<button class="resize ${c}" data-corner="${c}" aria-label="调整尺寸"></button>`).join('')+'<button class="canvas-delete" data-action="canvas-delete" aria-label="移除单品">×</button>');$('#canvas-tools').innerHTML=canvasTools();el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{const dx=(ev.clientX-sx)*scale,dy=(ev.clientY-sy)*scale;let p;if(corner){const l=corner.includes('l'),t=corner.includes('t');const width=Math.max(60,Math.min(l?old.x+old.width:600-old.x,old.width+(l?-dx:dx))),height=Math.max(60,Math.min(t?old.y+old.height:700-old.y,old.height+(t?-dy:dy)));p={width,height,x:l?old.x+old.width-width:old.x,y:t?old.y+old.height-height:old.y};}else p={x:Math.max(0,Math.min(600-old.width,old.x+dx)),y:Math.max(0,Math.min(700-old.height,old.y+dy))};Object.assign(editor.items[n],p);const i=editor.items[n];el.style.left=i.x/6+'%';el.style.top=i.y/7+'%';el.style.width=i.width/6+'%';el.style.height=i.height/7+'%';};el.onpointerup=el.onpointercancel=()=>{el.onpointermove=null;};};});}
function shiftPeriod(dir){const d=parseDate(anchor);if(period==='week')d.setDate(d.getDate()+dir*7);else if(period==='month')d.setFullYear(d.getFullYear(),d.getMonth()+dir,1);else d.setFullYear(d.getFullYear()+dir,0,1);anchor=dateKey(d);render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,cid=el.dataset.id;switch(a){case 'close-modal':closeModal();break;case 'add-item':clothingModal();break;case 'edit-item':clothingModal(cid);break;case 'favorite':if(save({items:data.items.map(i=>i.id===cid?{...i,favorite:!i.favorite}:i)}))render();break;case 'category':category=el.dataset.value;render();break;case 'filters':showFilters=!showFilters;render();break;case 'reset-filter':filters={color:'全部颜色',season:'全部季节',occasion:'全部场合',favorite:false};render();break;case 'delete-item':confirmDelete('删除这件衣物？','这件衣物也会从已保存的搭配中移除。历史穿搭记录保留当时的单品快照。',()=>{if(save({items:data.items.filter(i=>i.id!==cid),outfits:data.outfits.map(o=>({...o,items:o.items.filter(i=>i.clothingId!==cid)}))})){toast('衣物已删除');go('/wardrobe');}else return false;});break;case 'new-outfit':go('/outfits/new');break;case 'save-outfit':if(!editor.items.length){toast('请先添加至少一件衣物');break;}const o={id:editor.id||id(),name:editor.name.trim()||'未命名搭配',items:editor.items,occasion:editor.occasion,season:editor.season,createdAt:data.outfits.find(o=>o.id===editor.id)?.createdAt||new Date().toISOString()};if(save({outfits:editor.id?data.outfits.map(v=>v.id===editor.id?o:v):[o,...data.outfits]})){toast('搭配已保存');go('/outfits');}break;case 'delete-outfit':confirmDelete('删除这套搭配？','这套搭配将从搭配库移除，已记录的历史穿搭保留。',()=>{if(save({outfits:data.outfits.filter(o=>o.id!==cid)})){toast('搭配已删除');go('/outfits');}else return false;});break;case 'canvas-add':editor.items.push({clothingId:cid,x:190,y:210,width:220,height:280,rotation:0,zIndex:Math.max(0,...editor.items.map(i=>i.zIndex))+1});editor.selected=editor.items.length-1;updateCanvas();break;case 'canvas-delete':confirmDelete('移除这件单品？','从当前画布中移除，不影响衣橱中的衣物。',()=>{editor.items.splice(editor.selected,1);editor.selected=null;updateCanvas();});break;case 'forward':editor.items[editor.selected].zIndex=Math.max(...editor.items.map(i=>i.zIndex))+1;updateCanvas();break;case 'backward':editor.items[editor.selected].zIndex=Math.min(...editor.items.map(i=>i.zIndex))-1;updateCanvas();break;case 'picker-category':editor.category=el.dataset.value;$('#picker-items').innerHTML=pickerItems();$$('.picker .tabs button').forEach(b=>b.classList.toggle('selected',b===el));break;case 'add-inspiration':inspirationModal();break;case 'delete-inspiration':confirmDelete('删除这份灵感？','这张图片将从你的灵感收藏中移除。',()=>{if(save({inspirations:data.inspirations.filter(i=>i.id!==cid)})){toast('灵感已删除');go('/inspiration');}else return false;});break;case 'recreate':editor=null;go('/outfits/new?inspired=1');break;case 'profile':profileModal();break;case 'add-log':logModal();break;case 'edit-log':logModal(cid);break;case 'record-outfit':logModal(null,cid);break;case 'delete-log':confirmDelete('删除这条穿搭记录？','这次穿着将不再计入对应周期的日志与爱用单品统计。',()=>{if(save({logs:data.logs.filter(l=>l.id!==cid)})){toast('穿搭记录已删除');}else return false;});break;case 'period':period=el.dataset.value;render();break;case 'previous-period':shiftPeriod(-1);break;case 'next-period':shiftPeriod(1);break;case 'current-period':anchor=dateKey();render();break;case 'settings':openModal('设置','<p class="muted">你的衣橱和身材数据保存在当前浏览器中，无需注册账号。真实 AI 尚未接入，上传识别为可修改的模拟结果。</p><button class="button" data-action="close-modal">知道了</button>');break;}});
