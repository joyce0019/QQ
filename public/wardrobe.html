/* Adapted to the wardrobe brief from OpenDesign's minimal/DESIGN.md.
   Neutral surfaces, readable type, an 8px rhythm, and restrained interaction. */
:root {
  --bg: #f4f4f1;
  --ink: #0c0c09;
  --muted: #70706a;
  --line: #e2e2dc;
  --green: #0c0c09;
  --surface: #ffffff;
  --soft: #eeeee8;
  --radius: 16px;
}
body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.6; }
.main { max-width: 1440px; padding: 64px 80px 136px; }
h1 { font-size: 44px; font-weight: 500; letter-spacing: -1.5px; line-height: 1.2; margin-bottom: 16px; }
h2 { font-weight: 500; letter-spacing: -.5px; }
h3 { font-weight: 500; }
.page-header { margin-bottom: 40px; }
.page-header p { font-size: 14px; color: var(--muted); }
.eyebrow { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 16px; }
.button { min-height: 44px; border-radius: 12px; padding: 12px 20px; font-size: 13px; background: var(--ink); transition: background 180ms, border-color 180ms, box-shadow 180ms; }
.button:hover { background: #30302b; }
.button.secondary { background: transparent; color: var(--ink); border-color: #d5d5cd; }
.button.secondary:hover { background: #e9e9e2; border-color: #bdbdb3; }
.button.danger { background: #a82d29; }
.button.danger:hover { background: #8c231f; }
.button:active:not(:disabled) { box-shadow: inset 0 0 0 2px #ffffff30; }
button:disabled { opacity: .45; }
:where(button,a,input,textarea,select):focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
.text-button, .back, .source, .section-heading a { color: #585852; font-size: 12px; }
.text-button { border-radius: 8px; }
.text-button:hover { color: var(--ink); background: #e9e9e2; }
.back:hover, .section-heading a:hover, .source:hover { color: var(--ink); }
.summary { padding: 24px 0; margin-bottom: 40px; gap: 48px; }
.summary strong { font-size: 32px; font-weight: 400; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.summary>div { gap: 12px; }
.summary>div>span:last-child { font-size: 12px; color: var(--muted); }
.summary>p { color: var(--muted); font-size: 12px; }
.section-heading { margin-bottom: 24px; gap: 16px; }
.section-heading h2 { font-size: 24px; line-height: 1.4; }
.home-section { margin-bottom: 48px; }
.clothing-grid { gap: 32px 24px; }
.clothing-image { background: #eaeae4; border-radius: var(--radius); }
.clothing-image img { padding: 24px; }
.clothing-card h3 { margin-top: 16px; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.clothing-card p { color: var(--muted); font-size: 12px; }
.favorite { color: var(--ink); background: #ffffffed; font-size: 22px; width: 34px; height: 34px; }
.favorite:hover { background: #fff; }
.outfit-card { border-radius: var(--radius); box-shadow: none; transition: box-shadow 180ms; }
.outfit-card:hover { box-shadow: 0 0 0 1px #cecec4; }
.outfit-caption { padding: 24px; }
.outfit-caption h3 { font-size: 15px; }
.outfit-caption p { font-size: 12px; color: var(--muted); }
.outfit-preview { border-radius: var(--radius); }
.inspiration-card { border-radius: var(--radius); background: #eaeae4; }
.inspiration-overlay { font-size: 12px; }
.toolbar { gap: 16px; margin-bottom: 24px; }
.search { height: 48px; color: var(--muted); border-color: #d5d5cd; background: #fafaf8; }
.search:focus-within { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.search input { font-size: 13px; }
.tabs { gap: 8px; padding-bottom: 24px; }
.tabs button { color: var(--muted); font-size: 12px; padding: 10px 16px; }
.tabs button.selected { color: #fff; background: var(--ink); }
.tabs button:hover:not(.selected) { background: #e5e5de; color: var(--ink); }
.collection-count { font-size: 12px; color: var(--muted); margin: 24px 0; }
.filter-panel { padding: 24px; gap: 16px; background: var(--soft); }
.filter-panel .field { min-width: 130px; }
.check { color: #585852; }
input[type="checkbox"] { accent-color: var(--ink); }
.today-section { background: #eaeae3; padding: 32px; margin-bottom: 48px; border-radius: 20px; }
.today-empty { background: #f7f7f3; padding: 32px; gap: 24px; }
.today-empty h3 { font-size: 20px; }
.today-empty p { font-size: 13px; color: var(--muted); }
.profile-card { padding: 32px; box-shadow: none; margin-bottom: 48px; }
.body-data>div { padding: 4px 16px; }
.body-data span { color: var(--muted); font-size: 12px; }
.body-data strong { color: var(--ink); font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
.body-data small { color: var(--muted); font-size: 11px; }
.privacy-note { color: var(--muted); font-size: 12px; line-height: 1.7; }
.period-tabs { background: #e6e6df; border-radius: 12px; }
.period-tabs button { color: #686861; font-size: 13px; padding: 10px 24px; }
.period-tabs button.selected { color: #fff; background: var(--ink); box-shadow: none; }
.period-picker, .anchor-label { color: #666660; font-size: 12px; }
.anchor-label input { color: var(--ink); font-size: 12px; border-color: #d5d5cd; }
.journal-toolbar { gap: 16px; }
.journal-summary { padding: 24px 0; margin-bottom: 32px; gap: 40px; color: var(--muted); font-size: 12px; }
.journal-summary b { color: var(--ink); font-weight: 400; font-variant-numeric: tabular-nums; }
.logs-grid { gap: 24px; }
.log-card { border-radius: var(--radius); background: var(--surface); }
.log-card>.outfit-preview { height: auto; min-height: 0; aspect-ratio: 6/7; align-self: center; }
.log-card>.outfit-preview img { height: var(--item-height)!important; }
.log-copy { padding: 24px; }
.log-date { font-size: 11px; color: var(--muted); }
.log-copy h3 { font-size: 18px; }
.log-copy p { color: var(--muted); font-size: 12px; }
.log-pieces span { background: var(--soft); color: #62625b; padding: 6px 8px; font-size: 10px; }
.log-copy .text-button { font-size: 11px; }
.favorites-section { margin-top: 48px; }
.favorites-section .muted, .ranking-note { color: var(--muted); font-size: 12px; }
.rank-grid { gap: 16px; margin-top: 24px; }
.rank-card { padding: 16px; }
.rank-card img { background: #eeeee8; }
.rank-index { color: #5e5e57; font: 13px monospace; top: 24px; left: 24px; }
.rank-card h3 { font-size: 13px; }
.rank-card p { font-size: 12px; color: var(--muted); }
.rank-card .text-button { font-size: 11px; }
.ranking-empty { background: #eaeae3; color: var(--muted); font-size: 13px; }
.detail-clothing { background: #eaeae4; }
.detail-copy h1 { font-size: 36px; letter-spacing: -.8px; }
.detail-copy dl>div { font-size: 14px; padding: 16px 0; }
.detail-copy dt { color: var(--muted); flex-shrink: 0; }
.detail-copy dd { color: var(--ink); overflow-wrap: anywhere; }
.notes { color: var(--muted); font-size: 14px; }
.detected { padding: 24px 0; }
.detected small { color: var(--muted); font-size: 11px; }
.chips>span { color: #62625b; background: #eeeee8; border-color: transparent; font-size: 12px; }
.match-label { color: #62625b; font-size: 11px; }
.similar-grid h3 { font-size: 12px; }
.similar-grid p { font-size: 11px; }
.sidebar { height: 80px; padding: 0 40px; background: #fafaf8f5; border-color: #dcdcd3; box-shadow: none; }
.sidebar .logo { font-size: 20px; letter-spacing: 1px; }
.sidebar .logo small { color: var(--muted); font-size: 10px; }
.sidebar nav { gap: 8px; }
.sidebar nav a { color: #666660; min-width: 100px; padding: 12px 24px; border-radius: 12px; font-size: 13px; }
.sidebar nav a.active { color: #fff; background: var(--ink); }
.sidebar nav a:hover:not(.active) { background: #e9e9e2; color: var(--ink); }
.sidebar>.settings-btn { color: #62625b; font-size: 13px; }
.backdrop { background: #0c0c0959; backdrop-filter: blur(4px); }
.modal { padding: 32px; box-shadow: 0 24px 80px #0c0c0926; }
.modal-heading h2 { font-size: 26px; font-weight: 500; }
.field { font-size: 12px; color: #45453e; margin: 20px 0; }
.field>input, .field>select, .field>textarea { font-size: 13px; padding: 12px; color: var(--ink); border-color: #d5d5cd; background: #fafaf8; }
.field small, .field>span { font-size: 11px; color: var(--muted); }
.upload { background: #f4f4ef; border-color: #b9b9ad; color: #63635b; }
.upload b, .upload .replace { color: var(--ink); }
.upload>div p { font-size: 14px; }
.upload small { color: var(--muted); font-size: 11px; }
.upload-status { color: #666660; font-size: 12px; }
.ai-note { color: #474740; font-size: 12px; }
.ai-note small { color: var(--muted); font-size: 11px; }
.multi-chip span { border-color: #d5d5cd; color: #666660; font-size: 12px; }
.multi-chip input:checked+span { color: #fff; background: var(--ink); border-color: var(--ink); }
.log-selector label { background: #f0f0ea; }
.log-selector label:has(input:checked) { box-shadow: inset 0 0 0 1px var(--ink); background: #e5e5dc; }
.log-selector span { color: #55554d; font-size: 11px; }
.toast { color: #fff; background: var(--ink); bottom: 104px; font-size: 13px; }
.empty { color: #77776e; padding: 80px 24px; }
.empty h2 { color: var(--ink); }
.empty p { color: var(--muted); font-size: 14px; }
.icon { color: #62625b; }
.icon:hover { background: #e9e9e2; color: var(--ink); }
.editor-header { padding-bottom: 24px; }
.editor-meta { gap: 24px; }
.editor-body { border-color: #d5d5cd; border-radius: var(--radius); }
.picker { padding: 24px 16px; }
.picker h2 { font-size: 18px; }
.picker h2 small, .picker-hint { color: var(--muted); font-size: 11px; }
.picker .tabs button { font-size: 11px; }
.picker-grid span { color: #55554d; font-size: 11px; }
.picker-grid img { background: #eeeee8; }
.picker-grid button:hover { background: #eaeae2; }
.canvas-area { background: #e8e8e1; padding: 24px; }
.canvas-top { color: #666660; font-size: 11px; }
.canvas { background: #f4f4f1; box-shadow: none; }
.canvas-item.selected { border-color: var(--ink); }
.resize { border-color: var(--ink); }
.canvas-delete { color: var(--ink); }
.canvas-empty { color: #8c8c80; }
.canvas-empty h2 { color: #62625b; font: 500 20px Inter, -apple-system, "PingFang SC", sans-serif; }
.canvas-empty p { color: var(--muted); font-size: 12px; }
.canvas-tools { color: #62625b; font-size: 12px; }
.canvas-tools .button { font-size: 11px; }
@media (max-width:1150px) {
  .main { padding: 48px 40px 128px; }
  .sidebar { padding: 0 24px; }
  .sidebar nav a { min-width: 88px; padding: 12px 18px; }
  .editor-body { grid-template-columns: 280px minmax(0,1fr); }
  .logs-grid .log-card { display: grid; grid-template-columns: 38% minmax(0,1fr); }
  .body-data { gap: 24px; }
}
@media (max-width:800px) {
  .main { padding: 40px 24px 120px; }
  h1 { font-size: 36px; }
  .page-header { margin-bottom: 32px; }
  .sidebar { height: 76px; padding: 0 16px; }
  .sidebar nav { width:100%; gap: 8px; }
  .sidebar nav a { min-width: 0; padding: 12px 16px; }
  .summary { gap: 32px; }
  .today-section, .profile-card { padding: 24px; }
  .logs-grid { grid-template-columns: 1fr; }
  .editor-body { grid-template-columns: 230px minmax(0,1fr); }
  .editor-meta { gap: 16px; }
  .canvas-area { padding: 20px 16px; }
  .home-inspiration .inspiration-card { height: 260px; }
}
@media (max-width:550px) {
  .main { padding: 32px 20px 112px; }
  h1 { font-size: 32px; letter-spacing: -.7px; }
  .page-header p { font-size: 12px; }
  .page-header .button { font-size: 12px; padding: 10px 12px; }
  .eyebrow { font-size: 9px; letter-spacing: 1px; }
  .section-heading h2 { font-size: 22px; }
  .section-heading a { font-size: 11px; }
  .summary { gap: 24px; padding: 20px 0; margin-bottom: 32px; }
  .summary>div { gap: 6px; }
  .summary strong { font-size: 26px; }
  .summary>div>span:last-child { font-size: 11px; }
  .today-section { padding: 24px 20px; margin-bottom: 40px; }
  .today-empty { padding: 24px 16px; }
  .today-empty h3 { font-size: 18px; }
  .today-empty p { font-size: 12px; }
  .home-section { margin-bottom: 40px; }
  .clothing-grid { gap: 24px 16px; }
  .clothing-image img { padding: 16px; }
  .clothing-card h3 { font-size: 13px; margin-top: 12px; }
  .clothing-card p { font-size: 11px; }
  .home-inspiration .inspiration-card { height: 220px; }
  .sidebar { height: 76px; padding: 0 8px; padding-bottom: env(safe-area-inset-bottom,0px); }
  .sidebar nav { gap: 4px; }
  .sidebar nav a { padding: 9px 12px; font-size: 11px; gap: 5px; }
  .sidebar nav svg { width: 18px; }
  .profile-card { padding: 24px 20px; }
  .body-data>div { padding: 0; }
  .body-data strong { font-size: 24px; }

/* Premium editorial system — one restrained visual language across every view. */
:root {
  --bg: #f7f6f2;
  --ink: #1f1f1f;
  --muted: #767676;
  --line: #e8e6e1;
  --green: #6f8068;
  --green-dark: #5e6f58;
  --green-soft: #edf0ea;
  --soft: #efeee9;
  --surface: #fff;
  --radius: 18px;
}
html { background: var(--bg); scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.65;
}
#content > * { animation: page-in 320ms ease both; }
.main { max-width: 1520px; padding: 56px 64px 148px; }
.app-topbar { max-width: 1520px; padding: 28px 64px 0; }
.home-brand { color: var(--ink); font-size: 17px; font-weight: 600; letter-spacing: .08em; }
.home-brand span { color: var(--muted); letter-spacing: .15em; margin-top: 4px; }
.app-topbar .icon { width: 40px; height: 40px; border: 1px solid var(--line); background: #ffffffb8; color: var(--muted); }
.app-topbar .icon:hover { background: var(--surface); color: var(--ink); }
h1 { font-size: clamp(48px, 4.1vw, 64px); line-height: 1.06; letter-spacing: -.055em; font-weight: 550; }
h2 { font-size: clamp(28px, 2.5vw, 36px); line-height: 1.18; letter-spacing: -.035em; font-weight: 550; }
h3 { font-weight: 550; }
.eyebrow { color: var(--green); font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 18px; }
.page-header { align-items: end; margin-bottom: 38px; }
.page-header > div { max-width: 680px; }
.page-header h1 { margin-bottom: 14px; }
.page-header p { color: var(--muted); font-size: 15px; max-width: 520px; }
.button {
  min-height: 44px;
  padding: 11px 18px;
  border: 1px solid var(--green);
  border-radius: 12px;
  background: var(--green);
  color: #fff;

  transition: background 200ms ease, border-color 200ms ease, color 200ms ease, transform 200ms ease;
}

.text-button { color: var(--green-dark); }
.icon { color: var(--muted); transition: background 200ms ease, color 200ms ease; }
.icon:hover { background: var(--green-soft); color: var(--ink); }

.clothing-card { min-width: 0; }
.clothing-image,

.favorite.is-favorite { color: var(--green-dark); }
.status-badge { left: 12px; bottom: 12px; background: #363833e8; font-size: 10px; }
.outfit-grid { gap: 48px 26px; }
.outfit-card .outfit-preview { aspect-ratio: 4 / 5; border-radius: 18px; background: var(--soft); transition: background 200ms ease; }
.outfit-card:hover .outfit-preview { background: #ebeae4; }
.outfit-caption { padding-top: 16px; }
.outfit-caption h3 { font-size: 16px; }
.outfit-caption p { color: var(--muted); font-size: 13px; }

/* Wardrobe collections read as visual stories rather than dashboard metrics. */
.wardrobe-overview { gap: 40px; padding: 18px 0 28px; margin: -8px 0 72px; border-bottom: 1px solid var(--line); }
.wardrobe-overview strong { font-size: 24px; }
.wardrobe-overview span { font-size: 11px; }
.smart-section { margin-bottom: 92px; }
.smart-collections { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; }
.smart-collections button {
  min-height: 250px;
  padding: 0 0 2px;
  border: 0;
  border-radius: 18px;
  background: transparent;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 2px 12px;
  text-align: left;
}
.smart-collections button:hover, .smart-collections button.selected { background: transparent; border-color: transparent; }
.smart-collections button img, .smart-collections button i {
  grid-column: 1 / -1;
  display: block;
  width: 100%;
  height: 208px;
  margin-bottom: 12px;
  object-fit: contain;
  padding: 20px;
  border-radius: 18px;
  background: var(--soft);
  transition: background 200ms ease, transform 200ms ease;
}
.smart-collections button:hover img, .smart-collections button.selected img { background: #e5e9e2; transform: scale(1.015); }
.smart-collections button.selected span { color: var(--green-dark); }
.smart-collections span { font-size: 15px; font-weight: 550; }
.smart-collections b { font-size: 11px; font-weight: 400; color: var(--muted); }
.all-items-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin: 0 0 30px; }
.all-items-head .eyebrow { margin-bottom: 10px; }
.all-items-head h2 { margin: 0; }
.all-items-head > span { color: var(--muted); font-size: 12px; }
.toolbar { margin-bottom: 22px; }
.search { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); }
.search:focus-within { border-color: #b8c2b3; box-shadow: 0 0 0 3px #6f806810; }
.tabs { gap: 6px; padding-bottom: 20px; }
.tabs button { border-radius: 10px; color: var(--muted); }
.tabs button.selected { background: var(--green-soft); color: var(--green-dark); }
.tabs button:hover:not(.selected) { background: #efeee9; }
.collection-count { color: var(--muted); margin: 0 0 26px; font-size: 12px; }
.filter-drawer { padding: 32px; border-radius: 20px; background: #fbfaf7; box-shadow: 0 24px 70px #25271f1c; }
.filter-options span { border-radius: 12px; }
.filter-options input:checked + span, .multi-chip input:checked + span { background: var(--green); border-color: var(--green); color: #fff; }
.filter-actions { background: #fbfaf7; }
.status-select { background: var(--green-soft); color: var(--green-dark); }

/* Outfit editor: a spacious personal moodboard. */
.editor-header { padding-bottom: 30px; }
.editor-header > span { font-size: 13px; color: var(--muted); }
.editor-meta { gap: 20px; margin-bottom: 28px; }
.editor-body { grid-template-columns: 310px minmax(0, 1fr); border: 0; border-radius: 20px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.picker { padding: 28px 20px; background: var(--surface); border-right: 1px solid var(--line); }
.picker h2 { font-size: 21px; }
.picker .tabs { padding-bottom: 18px; }
.picker-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
.picker-grid button { border-radius: 14px; }
.picker-grid button:hover { background: var(--green-soft); }
.picker-grid img { aspect-ratio: 4 / 5; background: var(--soft); border-radius: 12px; }
.picker-grid span { color: var(--ink); font-size: 11px; }
.canvas-area { padding: 28px; background: #eceae3; }
.canvas-top { color: var(--muted); margin-bottom: 14px; }
.canvas { background-color: #f8f6ef; background-image: radial-gradient(#cfcdbf55 .7px, transparent .7px); background-size: 10px 10px; box-shadow: 0 18px 50px #403b2610; }
.canvas-item.selected { border: 1px solid #8b9586; }
.resize { width: 8px; height: 8px; border: 1px solid #7e8979; background: #fff; }
.canvas-delete { background: #fff; color: var(--ink); box-shadow: 0 2px 9px #0001; }
.canvas-empty h2 { color: #626a5e; font-size: 24px; }
.canvas-empty p, .canvas-tools { color: var(--muted); }

/* Inspiration: varied rhythm, metadata revealed only when useful. */
.masonry { display: block; column-count: 4; column-gap: 22px; }
.masonry .inspiration-card { display: inline-block; width: 100%; margin: 0 0 22px; break-inside: avoid; border-radius: 18px; overflow: hidden; background: var(--soft); }
.masonry .inspiration-card:nth-child(3n+1) { aspect-ratio: 4 / 5; }
.masonry .inspiration-card:nth-child(3n+2) { aspect-ratio: 3 / 4; }
.masonry .inspiration-card:nth-child(3n) { aspect-ratio: 5 / 6; }
.masonry .inspiration-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 260ms ease; }
.masonry .inspiration-card:hover img { transform: scale(1.015); }
.inspiration-overlay { opacity: 0; transition: opacity 200ms ease; background: linear-gradient(transparent 52%, #15171299); }
.inspiration-card:hover .inspiration-overlay, .inspiration-card:focus-visible .inspiration-overlay { opacity: 1; }
.home-inspiration { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.home-inspiration .inspiration-card { height: auto; aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden; }
.home-inspiration .inspiration-card img { width: 100%; height: 100%; object-fit: cover; }

/* Supporting views stay quiet and consistent. */
.profile-card, .log-card, .rank-card, .activity-grid div { border-radius: 18px; background: var(--surface); }
.profile-card { padding: 36px; margin-bottom: 72px; }
.period-tabs { border-radius: 12px; background: #ebeae5; }
.period-tabs button { border-radius: 9px; }
.period-tabs button.selected { background: var(--surface); color: var(--green-dark); box-shadow: 0 2px 8px #292a2108; }
.rank-card { padding: 16px; }
.rank-card img { aspect-ratio: 4 / 5; border-radius: 12px; background: var(--soft); }
.detail-layout { gap: 64px; }
.detail-copy h1 { font-size: clamp(40px, 4vw, 58px); }
.detail-clothing, .inspiration-large { border-radius: 20px; background: var(--soft); }
.empty { min-height: 420px; padding: 110px 24px; background: transparent; color: var(--green); }
.empty h2 { font-size: 32px; }
.empty p { max-width: 380px; margin-left: auto; margin-right: auto; color: var(--muted); }

/* Dialogs and feedback. */
.backdrop { background: #27282052; backdrop-filter: blur(7px); }
.modal { padding: 34px; border-radius: 20px; background: #fbfaf7; box-shadow: 0 28px 90px #17181324; animation: modal-in 280ms cubic-bezier(.22,.8,.24,1) both; }
.modal-heading { margin-bottom: 24px; }
.modal-heading h2 { font-size: 28px; }
.field { margin: 20px 0; }
.field > input, .field > select, .field > textarea { min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.upload { border: 1px dashed #bcc4b8; border-radius: 16px; background: #f2f2ed; }
.more-details { border-color: var(--line); }
.more-details summary { color: var(--green-dark); }
.toast { bottom: 102px; border-radius: 12px; background: #292b27; animation: toast-in 260ms ease both; }

@keyframes page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes modal-in { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

function bindUpload(initial,onFile){

function logModal(logId,outfitId,photo){const old=data.logs.find(l=>l.id===logId),selectedOutfit=outfitId||old?.outfitId||'';let image;const selectedIds=new Set(old?.pieces.map(p=>p.id)||data.outfits.find(o=>o.id===selectedOutfit)?.items.map(i=>i.clothingId)||[]);const available=[...data.items,...(old?.pieces.filter(p=>!data.items.some(i=>i.id===p.id))||[])];openModal(old?'编辑穿搭记录':'记录今日穿搭',`<form>${field('穿着日期','date',old?.date||dateKey(),'date','required max="'+dateKey()+'"')}${select('从已保存搭配选择（也可以直接勾选单品）','outfitId',['不使用已保存搭配'], '不使用已保存搭配')}<div class="field">这次穿着的单品 <span class="muted">（至少一件）</span><div class="log-selector">${available.map(i=>`<label><input type="checkbox" name="pieces" value="${i.id}" ${selectedIds.has(i.id)?'checked':''}><img src="${esc(i.image)}" alt=""><span>${esc(i.name)}</span></label>`).join('')}</div></div>${field('记录名称','name',old?.name||data.outfits.find(o=>o.id===selectedOutfit)?.name||'今日穿搭','text','required')}${select('场合','occasion',occasions,old?.occasion||'日常')}${uploadBlock(old?.photo||photo,'添加实际穿着照片（选填）')}<label class="field">备注（选填）<textarea name="notes" placeholder="今天的场合、感受，或搭配心得">${esc(old?.notes||'')}</textarea></label><div class="modal-actions"><button type="button" class="button secondary" data-action="close-modal">取消</button><button type="submit" class="button">保存穿搭记录</button></div></form>`,f=>{const ids=f.getAll('pieces');if(!ids.length){toast('请至少选择一件穿着的单品');return;}if(image().busy)return;const name=f.get('name').trim();if(!name){toast('请输入记录名称');return;}const date=f.get('date');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>dateKey()){toast('请选择今天或之前的日期');return;}const outfit=data.outfits.find(o=>o.id===f.get('outfitId'));const pieces=ids.map(cid=>({...available.find(i=>i.id===cid)}));const originalLayout=outfit?.items||old?.layout||[];const included=new Set(ids);let layout=originalLayout.filter(i=>included.has(i.clothingId));const existingIds=new Set(layout.map(i=>i.clothingId));layout=[...layout,...compose(ids.filter(i=>!existingIds.has(i)))];const log={id:old?.id||id(),date,name,outfitId:outfit?.id||'',occasion:f.get('occasion'),pieces,layout,photo:image().value,notes:f.get('notes').trim(),createdAt:old?.createdAt||new Date().toISOString()};const logs=old?data.logs.map(l=>l.id===old.id?log:l):[log,...data.logs];if(save({logs})){closeModal();toast('穿搭记录已保存');render();}});const outfitSelect=$('.modal [name="outfitId"]');outfitSelect.innerHTML=`<option value="">不使用已保存搭配</option>`+data.outfits.map(o=>`<option value="${o.id}" ${o.id===selectedOutfit?'selected':''}>${esc(o.name)}</option>`).join('');outfitSelect.onchange=()=>{const o=data.outfits.find(o=>o.id===outfitSelect.value);if(o){$$('.modal [name="pieces"]').forEach(el=>el.checked=o.items.some(i=>i.clothingId===el.value));$('.modal [name="name"]').value=o.name;$('.modal [name="occasion"]').value=o.occasion||'日常';}};image=bindUpload(old?.photo||photo);}
function editorPage(oid){if(!editor){const o=data.outfits.find(o=>o.id===oid);if(oid&&!o)return missing('/outfits');const current=route(),inspired=current.includes('?inspired=1'),requested=new URLSearchParams(current.split('?')[1]||'').get('item'),starter=requested&&data.items.some(i=>i.id===requested)?compose([requested]):[];editor={id:oid,name:o?.name||(inspired?'灵感搭配':'未命名搭配'),items:structuredClone(o?.items||(inspired?compose(matches().map(i=>i.id)):starter)),occasion:o?.occasion||'日常',season:o?.season||'春季',selected:null,search:'',category:'全部'};}return `<div class="editor"><div class="editor-header">${back('/outfits','返回')}<span>${oid?'编辑搭配':'新建搭配'}</span><button class="button" data-action="save-outfit">保存</button></div><div class="editor-meta">${field('搭配名称','outfitName',editor.name)}${select('场合','outfitOccasion',occasions.filter(o=>o!=='运动'),editor.occasion)}${select('季节','outfitSeason',seasons,editor.season)}</div><div class="editor-body"><div class="picker"><h2>我的衣橱 <small>${data.items.length} 件单品</small></h2><label class="search">⌕<input id="picker-search" placeholder="搜索衣物" value="${esc(editor.search)}"></label><div class="tabs">${['全部',...categories].map(c=>`<button data-action="picker-category" data-value="${c}" class="${editor.category===c?'selected':''}">${c}</button>`).join('')}</div><p class="picker-hint">点击衣物，将它添加到画布。</p><div class="picker-grid" id="picker-items">${pickerItems()}</div></div><div class="canvas-area"><div class="canvas-top"><span>自由组合你的风格</span><span id="canvas-count">${editor.items.length} 件单品</span></div><div class="canvas" id="canvas">${canvasItems()}</div><div class="canvas-tools" id="canvas-tools">${canvasTools()}</div></div></div></div>`;}
function pickerItems(){return data.items.filter(i=>(editor.category==='全部'||editor.category===i.category)&&i.name.toLowerCase().includes(editor.search.toLowerCase())).map(i=>`<button data-action="canvas-add" data-id="${i.id}"><img src="${esc(i.image)}" alt="${esc(i.name)}"><span>${esc(i.name)}</span>＋</button>`).join('')||'<p class="muted">没有匹配的单品。</p>';}
function canvasItems(){return editor.items.length?editor.items.map((i,n)=>{const c=data.items.find(c=>c.id===i.clothingId);return c?`<div class="canvas-item ${editor.selected===n?'selected':''}" data-index="${n}" style="left:${i.x/6}%;top:${i.y/7}%;width:${i.width/6}%;height:${i.height/7}%;z-index:${i.zIndex};transform:rotate(${i.rotation||0}deg)"><img src="${esc(c.image)}" alt="${esc(c.name)}" draggable="false">${editor.selected===n?['tl','tr','bl','br'].map(c=>`<button class="resize ${c}" data-corner="${c}" aria-label="缩放${{tl:'左上',tr:'右上',bl:'左下',br:'右下'}[c]}角"></button>`).join('')+`<button class="canvas-delete" data-action="canvas-delete" aria-label="移除单品">×</button>`:''}</div>`:'';}).join(''):'<div class="canvas-empty">'+icon('outfit')+'<h2>空白画布，无限可能。</h2><p>从衣橱选择一件单品，开始搭配。</p></div>';}
function canvasTools(){return editor.selected!==null?'<button class="button secondary" data-action="forward">↑ 移到上层</button><button class="button secondary" data-action="backward">↓ 移到下层</button>':'<span>拖动调整位置 · 选中单品调整尺寸</span>';}
function updateCanvas(){ $('#canvas').innerHTML=canvasItems();$('#canvas-count').textContent=editor.items.length+' 件单品';$('#canvas-tools').innerHTML=canvasTools();bindCanvas();}
function bindCanvas(){const canvas=$('#canvas');canvas.onpointerdown=e=>{if(e.target===canvas||e.target.closest('.canvas-empty')){editor.selected=null;updateCanvas();}};$$('.canvas-item').forEach(el=>{el.onpointerdown=e=>{if(e.target.closest('[data-action="canvas-delete"]'))return;e.preventDefault();e.stopPropagation();const n=Number(el.dataset.index),corner=e.target.dataset.corner;const old={...editor.items[n]},scale=600/canvas.getBoundingClientRect().width,sx=e.clientX,sy=e.clientY;editor.selected=n;$$('.canvas-item').forEach(i=>{i.classList.remove('selected');i.querySelectorAll('button').forEach(b=>b.remove());});el.classList.add('selected');el.insertAdjacentHTML('beforeend',['tl','tr','bl','br'].map(c=>`<button class="resize ${c}" data-corner="${c}" aria-label="调整尺寸"></button>`).join('')+'<button class="canvas-delete" data-action="canvas-delete" aria-label="移除单品">×</button>');$('#canvas-tools').innerHTML=canvasTools();el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{const dx=(ev.clientX-sx)*scale,dy=(ev.clientY-sy)*scale;let p;if(corner){const l=corner.includes('l'),t=corner.includes('t');const width=Math.max(60,Math.min(l?old.x+old.width:600-old.x,old.width+(l?-dx:dx))),height=Math.max(60,Math.min(t?old.y+old.height:700-old.y,old.height+(t?-dy:dy)));p={width,height,x:l?old.x+old.width-width:old.x,y:t?old.y+old.height-height:old.y};}else p={x:Math.max(0,Math.min(600-old.width,old.x+dx)),y:Math.max(0,Math.min(700-old.height,old.y+dy))};Object.assign(editor.items[n],p);const i=editor.items[n];el.style.left=i.x/6+'%';el.style.top=i.y/7+'%';el.style.width=i.width/6+'%';el.style.height=i.height/7+'%';};el.onpointerup=el.onpointercancel=()=>{el.onpointermove=null;};};});}
function shiftPeriod(dir){const d=parseDate(anchor);if(period==='week')d.setDate(d.getDate()+dir*7);else if(period==='month')d.setFullYear(d.getFullYear(),d.getMonth()+dir,1);else d.setFullYear(d.getFullYear()+dir,0,1);anchor=dateKey(d);render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,cid=el.dataset.id;switch(a){case 'journal-date':anchor=el.dataset.date;period='week';go('/me');break;case 'camera':cameraModal();break;case 'close-modal':closeModal();break;case 'add-item':clothingModal();break;case 'batch-add':batchModal();break;case 'edit-item':clothingModal(cid);break;case 'favorite':if(save({items:data.items.map(i=>i.id===cid?{...i,favorite:!i.favorite}:i)}))render();break;case 'category':category=el.dataset.value;render();break;case 'smart':activeSmart=activeSmart===el.dataset.value?'':el.dataset.value;category='全部';render();break;case 'filters':showFilters=!showFilters;render();break;case 'reset-filter':filters={category:[],color:[],season:[],occasion:[],status:[],usage:[]};render();break;case 'delete-item':confirmDelete('删除这件衣物？','这件衣物也会从已保存的搭配中移除。历史穿搭记录保留当时的单品快照。',()=>{if(save({items:data.items.filter(i=>i.id!==cid),outfits:data.outfits.map(o=>({...o,items:o.items.filter(i=>i.clothingId!==cid)}))})){toast('衣物已删除');go('/wardrobe');}else return false;});break;case 'new-outfit':go('/outfits/new');break;case 'create-with-item':editor=null;go('/outfits/new?item='+encodeURIComponent(cid));break;case 'save-outfit':if(!editor.items.length){toast('请先添加至少一件衣物');break;}const o={id:editor.id||id(),name:editor.name.trim()||'未命名搭配',items:editor.items,occasion:editor.occasion,season:editor.season,createdAt:data.outfits.find(o=>o.id===editor.id)?.createdAt||new Date().toISOString()};if(save({outfits:editor.id?data.outfits.map(v=>v.id===editor.id?o:v):[o,...data.outfits]})){toast('搭配已保存');go('/outfits');}break;case 'delete-outfit':confirmDelete('删除这套搭配？','这套搭配将从搭配库移除，已记录的历史穿搭保留。',()=>{if(save({outfits:data.outfits.filter(o=>o.id!==cid)})){toast('搭配已删除');go('/outfits');}else return false;});break;case 'canvas-add':editor.items.push({clothingId:cid,x:190,y:210,width:220,height:280,rotation:0,zIndex:Math.max(0,...editor.items.map(i=>i.zIndex))+1});editor.selected=editor.items.length-1;updateCanvas();break;case 'canvas-delete':confirmDelete('移除这件单品？','从当前画布中移除，不影响衣橱中的衣物。',()=>{editor.items.splice(editor.selected,1);editor.selected=null;updateCanvas();});break;case 'forward':editor.items[editor.selected].zIndex=Math.max(...editor.items.map(i=>i.zIndex))+1;updateCanvas();break;case 'backward':editor.items[editor.selected].zIndex=Math.min(...editor.items.map(i=>i.zIndex))-1;updateCanvas();break;case 'picker-category':editor.category=el.dataset.value;$('#picker-items').innerHTML=pickerItems();$$('.picker .tabs button').forEach(b=>b.classList.toggle('selected',b===el));break;case 'add-inspiration':inspirationModal();break;case 'delete-inspiration':confirmDelete('删除这份灵感？','这张图片将从你的灵感收藏中移除。',()=>{if(save({inspirations:data.inspirations.filter(i=>i.id!==cid)})){toast('灵感已删除');go('/inspiration');}else return false;});break;case 'recreate':editor=null;go('/outfits/new?inspired=1');break;case 'profile':profileModal();break;case 'add-log':logModal();break;case 'edit-log':logModal(cid);break;case 'record-outfit':logModal(null,cid);break;case 'delete-log':confirmDelete('删除这条穿搭记录？','这次穿着将不再计入对应周期的日志与爱用单品统计。',()=>{if(save({logs:data.logs.filter(l=>l.id!==cid)})){toast('穿搭记录已删除');}else return false;});break;case 'period':period=el.dataset.value;render();break;case 'previous-period':shiftPeriod(-1);break;case 'next-period':shiftPeriod(1);break;case 'current-period':anchor=dateKey();render();break;case 'settings':openModal('设置','<p class="muted">你的衣橱和身材数据保存在当前浏览器中，无需注册账号。真实 AI 尚未接入，上传识别为可修改的模拟结果。</p><button class="button" data-action="close-modal">知道了</button>');break;}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='wardrobe-search'){const pos=el.selectionStart;search=el.value;render();$('#wardrobe-search').focus();$('#wardrobe-search').setSelectionRange(pos,pos);}if(el.id==='picker-search'){editor.search=el.value;$('#picker-items').innerHTML=pickerItems();}if(editor&&el.name==='outfitName')editor.name=el.value;});
